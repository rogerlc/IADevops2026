name: Repository Quality

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate commit messages and pull request title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python scripts/validate_conventional_commits.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --title "$PR_TITLE"

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            practicas/02-github-mcp-server/pyproject.toml
            practicas/04-calculator-api/pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install -e "./practicas/02-github-mcp-server[dev]"
          python -m pip install -e "./practicas/04-calculator-api[dev]"

      - name: Test Conventional Commits validator
        run: python -m unittest discover --start-directory tests --verbose

      - name: Test GitHub MCP Server
        run: python -m pytest ./practicas/02-github-mcp-server

      - name: Test Calculator API
        run: python -m pytest ./practicas/04-calculator-api

      - name: Build Calculator API container
        run: docker build --tag iadevops-calculator-api ./practicas/04-calculator-api

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            practicas/02-github-mcp-server/pyproject.toml
            practicas/04-calculator-api/pyproject.toml

      - name: Install quality dependencies
        run: |
          python -m pip install -e "./practicas/02-github-mcp-server[dev]"
          python -m pip install -e "./practicas/04-calculator-api[dev]"

      - name: Run Ruff
        run: >-
          python -m ruff check
          ./practicas/02-github-mcp-server
          ./practicas/04-calculator-api
          ./scripts
          ./tests
